name: Fleet R6 Bounded PhiMada Code Candidate

# Manual only. This creates a patch artifact and runs checks, never writes GitHub source.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Current exact 40-character SHA for public PhiMadaPrime main"
        required: true
        type: string
      confirmation:
        description: "Type PROPOSE_PHI_MADA_COPY_FIX"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agentora-fleet-r6-phimada-fixed-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted Agentora candidate controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preflight: fixed repo, exact HEAD, operator confirmation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.source_sha }}
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          python scripts/fleet_r6_code_candidate.py preflight \
            --sha "$TARGET_SHA" --confirm "$CONFIRM" \
            --output candidate-control/preflight.json

      - name: Checkout public PhiMadaPrime at the exact source revision
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/PhiMadaPrime
          ref: ${{ inputs.source_sha }}
          path: candidate-src
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1

      - name: Produce one bounded and inspectable source-change patch
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/fleet_r6_code_candidate.py apply \
            --sha "$TARGET_SHA" --checkout candidate-src \
            --preflight candidate-control/preflight.json \
            --output-dir candidate-control/

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch test dependencies without lifecycle hooks
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          set +e
          npm install --prefix candidate-src --no-audit --no-fund --ignore-scripts --package-lock=false
          INSTALL_EXIT=$?
          set -e
          printf '{"checkout_sha":"%s","install_exit":%s,"test_exit":null,"build_exit":null}\n' \
            "$TARGET_SHA" "$INSTALL_EXIT" > candidate-control/steps.json
          if [[ "$INSTALL_EXIT" -ne 0 ]]; then
            echo "R6_HELD dependency install failed"
            exit 1
          fi

      - name: Execute fixed tests and build in network-disabled containers
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          docker pull node:22-bookworm-slim
          SRC="$GITHUB_WORKSPACE/candidate-src"
          sandbox() {
            local task="$1"
            timeout -k 10s 300s docker run --rm \
              --network none --read-only --user 1000:1000 \
              --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 128 --memory 2g --cpus 2 \
              --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 \
              --tmpfs /work:rw,exec,nosuid,size=1536m,mode=1777 \
              --mount "type=bind,src=$SRC,dst=/src,readonly" \
              -e HOME=/tmp -e CI=true \
              node:22-bookworm-slim \
              sh -euc 'cp -R /src/. /work/ && cd /work && case "$1" in test) npm test ;; build) npm run build ;; *) exit 2 ;; esac' \
              sh "$task"
          }
          set +e
          sandbox test
          TEST_EXIT=$?
          sandbox build
          BUILD_EXIT=$?
          set -e
          printf '{"checkout_sha":"%s","install_exit":0,"test_exit":%s,"build_exit":%s}\n' \
            "$TARGET_SHA" "$TEST_EXIT" "$BUILD_EXIT" > candidate-control/steps.json

      - name: Recheck current HEAD and finalize source/patch/test evidence
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! -f candidate-control/preflight.json ||
                ! -f candidate-control/candidate.json ||
                ! -f candidate-control/patch.diff ||
                ! -f candidate-control/steps.json ]]; then
            echo "R6_HELD incomplete candidate or test evidence"
            exit 1
          fi
          python scripts/fleet_r6_code_candidate.py finalize \
            --sha "$TARGET_SHA" --checkout candidate-src \
            --preflight candidate-control/preflight.json \
            --candidate candidate-control/candidate.json \
            --patch candidate-control/patch.diff \
            --steps candidate-control/steps.json \
            --output candidate-control/final.json

      - name: Upload review-only patch and bounded metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-r6-phimada-candidate-${{ github.run_id }}
          path: candidate-control/
          retention-days: 7
          if-no-files-found: warn
