name: desktop-r6-windows-identity-smoke

on:
  pull_request:
    paths:
      - "server/app/services/desktop_windows_restricted_ipc.py"
      - "server/tests/test_desktop_windows_restricted_ipc.py"
      - ".github/workflows/desktop-r6-windows-identity-smoke.yml"
  push:
    branches: [main]
    paths:
      - "server/app/services/desktop_windows_restricted_ipc.py"
      - "server/tests/test_desktop_windows_restricted_ipc.py"
      - ".github/workflows/desktop-r6-windows-identity-smoke.yml"

permissions:
  contents: read

jobs:
  windows-user-sid-pipe:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dedicated Windows IPC test dependencies
        run: python -m pip install pytest==8.3.3 pywin32==312
      - name: Test real restricted pipe with mocked desktop
        env:
          PYTHONPATH: server
        run: python -m pytest --noconftest -q server/tests/test_desktop_windows_restricted_ipc.py
