name: desktop-r8-field-ledger-offline-smoke

on:
  pull_request:
    paths:
      - "server/app/services/desktop_field_ledger.py"
      - "server/tests/test_desktop_field_ledger.py"
      - "server/app/services/desktop_windows_field_validation.py"
      - ".github/workflows/desktop-r8-field-ledger-offline-smoke.yml"
  push:
    branches: [main]
    paths:
      - "server/app/services/desktop_field_ledger.py"
      - "server/tests/test_desktop_field_ledger.py"
      - "server/app/services/desktop_windows_field_validation.py"
      - ".github/workflows/desktop-r8-field-ledger-offline-smoke.yml"

permissions:
  contents: read

jobs:
  windows-offline-records:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone test runner and optional Windows pipe backend
        run: python -m pip install pytest==8.3.3 pywin32==312
      - name: Test R8 local offline contracts without desktop activity
        env:
          PYTHONPATH: server
        run: python -m pytest --noconftest -q server/tests/test_desktop_field_ledger.py
