name: Phi Development Loop - governed auto-merge pilot

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, converted_to_draft]

# Privileged workflow always uses trusted base branch code, never the PR's code.
# GitHub's repository GET exposes merge settings only with contents:write.
# No PR-head checkout or code execution: all policy logic comes from trusted main.
permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: agentora-automerge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  govern:
    if: >-
      (github.event.action == 'labeled' && (github.event.label.name == 'phi-automerge' || github.event.label.name == 'phi-code-automerge' || github.event.label.name == 'phi-solo-automerge')) ||
      (github.event.action == 'unlabeled' && (github.event.label.name == 'phi-automerge' || github.event.label.name == 'phi-code-automerge' || github.event.label.name == 'phi-solo-automerge')) ||
      github.event.action == 'synchronize' ||
      github.event.action == 'converted_to_draft'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Apply governed GitHub-native auto-merge policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/devloop_automerge.py

      - name: Save bounded merge decision receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: devloop-merge-decision-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: devloop-artifacts/merge-decision.json
          retention-days: 30
          if-no-files-found: warn
