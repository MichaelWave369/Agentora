name: Fleet R7 Public Model Proposal Candidate

# Manual-only, fixed public repo. An imported model proposal is untrusted code.
# No GitHub code-write, PR creation, merge, deploy, recurring schedule or auto-run.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Current 40-character public PhiMadaPrime main SHA"
        required: true
        type: string
      proposal_b64:
        description: "Base64 UTF-8 JSON of one PUBLIC R7 proposal; never paste secrets"
        required: true
        type: string
      confirmation:
        description: "Type REVIEW_PUBLIC_PHI_MADA_MODEL_PATCH"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agentora-fleet-r7-phimada-model-candidate
  cancel-in-progress: false

jobs:
  review-proposal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted Agentora R7 controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify current public repository, HEAD and explicit confirmation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          python scripts/fleet_r7_model_proposal.py preflight \
            --sha "$SOURCE_SHA" --confirm "$CONFIRM" \
            --output r7-review/preflight.json

      - name: Decode untrusted public proposal without evaluating it
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          R7_PUBLIC_PROPOSAL_B64: ${{ inputs.proposal_b64 }}
        run: |
          set -euo pipefail
          python scripts/fleet_r7_model_proposal.py ingest \
            --sha "$SOURCE_SHA" --output r7-review/proposal.json

      - name: Checkout fixed public PhiMadaPrime source commit
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/PhiMadaPrime
          ref: ${{ inputs.source_sha }}
          path: r7-source
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1

      - name: Validate scope and apply one replacement on disposable local branch
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/fleet_r7_model_proposal.py apply \
            --sha "$SOURCE_SHA" --checkout r7-source \
            --preflight r7-review/preflight.json \
            --proposal r7-review/proposal.json \
            --output-dir r7-review

      - name: Install fixed Node 22 runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve dependencies with lifecycle scripts disabled
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          set +e
          npm install --prefix r7-source --no-audit --no-fund --ignore-scripts --package-lock=false
          INSTALL_EXIT=$?
          set -e
          printf '{"checkout_sha":"%s","install_exit":%s,"test_exit":null,"build_exit":null}\n' \
            "$SOURCE_SHA" "$INSTALL_EXIT" > r7-review/steps.json
          if [[ "$INSTALL_EXIT" -ne 0 ]]; then
            echo "FLEET_R7_HELD dependencies failed"
            exit 1
          fi

      - name: Run fixed tests and build inside network-disabled sandbox
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          docker pull node:22-bookworm-slim
          SRC="$GITHUB_WORKSPACE/r7-source"
          sandbox() {
            local task="$1"
            timeout -k 10s 300s docker run --rm \
              --network none --read-only --user 1000:1000 \
              --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 128 --memory 2g --cpus 2 \
              --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 \
              --tmpfs /work:rw,exec,nosuid,size=1536m,mode=1777 \
              --mount "type=bind,src=$SRC,dst=/src,readonly" \
              -e HOME=/tmp -e CI=true \
              node:22-bookworm-slim \
              sh -euc 'cp -R /src/. /work/ && cd /work && case "$1" in test) npm test ;; build) npm run build ;; *) exit 2 ;; esac' \
              sh "$task"
          }
          set +e
          sandbox test
          TEST_EXIT=$?
          sandbox build
          BUILD_EXIT=$?
          set -e
          printf '{"checkout_sha":"%s","install_exit":0,"test_exit":%s,"build_exit":%s}\n' \
            "$SOURCE_SHA" "$TEST_EXIT" "$BUILD_EXIT" > r7-review/steps.json

      - name: Recheck exact HEAD and independently reconstruct proposed patch
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! -f r7-review/preflight.json ||
                ! -f r7-review/proposal.json ||
                ! -f r7-review/candidate.json ||
                ! -f r7-review/patch.diff ||
                ! -f r7-review/steps.json ]]; then
            echo "FLEET_R7_HELD incomplete patch or test evidence"
            exit 1
          fi
          python scripts/fleet_r7_model_proposal.py finalize \
            --sha "$SOURCE_SHA" --checkout r7-source \
            --preflight r7-review/preflight.json \
            --proposal r7-review/proposal.json \
            --candidate r7-review/candidate.json \
            --patch r7-review/patch.diff \
            --steps r7-review/steps.json \
            --output r7-review/final.json

      - name: Publish short-lived review-only proposal and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-r7-public-model-candidate-${{ github.run_id }}
          path: r7-review/
          retention-days: 7
          if-no-files-found: warn
