name: Phi Development Loop R2.3 - Review Dashboard

on:
  workflow_dispatch:

# Explicitly read-only GitHub APIs, including Actions artifact receipts.
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  review-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main dashboard code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Correlate review queue, merge receipts and read-only handoffs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/devloop_r23_dashboard.py
      - name: Save bounded audit dashboard JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: devloop-r23-dashboard-${{ github.run_id }}
          path: devloop-artifacts/review-dashboard.json
          retention-days: 30
          if-no-files-found: warn
