name: Phi Development Loop R2 - code candidate advisory

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

# Advisory-only. Never use the PR head as runnable code.
permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main code only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Classify low-risk UI code and inspect review evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/devloop_r2_advisory.py
      - name: Upload read-only candidate report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: devloop-r2-advisory-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: devloop-artifacts/r2-advisory.json
          retention-days: 30
          if-no-files-found: warn
