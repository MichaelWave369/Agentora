name: desktop-r7-windows-validation-smoke

on:
  pull_request:
    paths:
      - "server/app/services/desktop_windows_field_validation.py"
      - "server/tests/test_desktop_windows_field_validation.py"
      - ".github/workflows/desktop-r7-windows-validation-smoke.yml"
  push:
    branches: [main]
    paths:
      - "server/app/services/desktop_windows_field_validation.py"
      - "server/tests/test_desktop_windows_field_validation.py"
      - ".github/workflows/desktop-r7-windows-validation-smoke.yml"

permissions:
  contents: read

jobs:
  windows-r7-headless-contracts:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest==8.3.3 pywin32==312
      - name: Test R7 contract without accessing Windows desktop
        env:
          PYTHONPATH: server
        run: python -m pytest --noconftest -q server/tests/test_desktop_windows_field_validation.py
